<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summer Command Center</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero" aria-label="Summer Command Center">
        <img src="assets/summer-command-center.png" alt="" />
        <div class="hero-copy">
          <p>Summer Command Center</p>
          <h1>Three profiles. One fair summer plan.</h1>
        </div>
      </section>

      <section class="topbar" aria-label="Today controls">
        <div>
          <p class="eyebrow">Today</p>
          <h2 id="todayLabel">Family Plan</h2>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="resetDay" type="button" aria-label="Reset today" title="Reset today">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
          </button>
        </div>
      </section>

      <section class="summary-grid" aria-label="Daily summary">
        <article class="panel score-panel">
          <div class="panel-heading">
            <h2>Day Score</h2>
            <span id="scoreText">0%</span>
          </div>
          <div class="meter" aria-hidden="true"><span id="scoreBar"></span></div>
          <div class="stats">
            <div>
              <strong id="taskDone">0</strong>
              <span>tasks done</span>
            </div>
            <div>
              <strong id="taskTotal">0</strong>
              <span>tasks today</span>
            </div>
            <div>
              <strong id="rotationKid">-</strong>
              <span>animal duty</span>
            </div>
          </div>
        </article>

        <article class="panel rotation-panel">
          <div class="panel-heading">
            <h2>Rotations</h2>
            <span id="weekdayBadge">daily</span>
          </div>
          <div id="rotationList" class="rotation-list"></div>
        </article>
      </section>

      <section class="profile-tabs" aria-label="Kid profiles" id="profileTabs"></section>

      <section id="profiles" class="profiles" aria-live="polite"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
